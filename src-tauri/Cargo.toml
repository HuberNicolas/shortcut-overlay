[package]
name = "shortcut-overlay"
version = "0.1.0"
description = "Overlay showing the most useful shortcuts of the focused app"
authors = ["Nicolas Huber"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between lib and bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "shortcut_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
x-win = "5"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
